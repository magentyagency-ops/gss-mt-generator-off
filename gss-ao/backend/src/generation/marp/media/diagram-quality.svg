<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" fill="none">
  <!-- Box 1 -->
  <rect x="10" y="25" width="100" height="100" rx="8" fill="#494545" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="65" font-family="'Outfit', sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">Niveau 1</text>
  <text x="60" y="85" font-family="'Inter', sans-serif" font-size="10" fill="#d9d9d9" text-anchor="middle">Contrôleur Terrain</text>
  <text x="60" y="100" font-family="'Inter', sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">1 à 3 / mois (Inopiné)</text>

  <!-- Arrow 1 -->
  <path d="M120 75h30" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Box 2 -->
  <rect x="150" y="25" width="100" height="100" rx="8" fill="#494545" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="65" font-family="'Outfit', sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">Niveau 2</text>
  <text x="200" y="85" font-family="'Inter', sans-serif" font-size="10" fill="#d9d9d9" text-anchor="middle">Chef de Site</text>
  <text x="200" y="100" font-family="'Inter', sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">Mensuel (Planifié)</text>

  <!-- Arrow 2 -->
  <path d="M260 75h30" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Box 3 -->
  <rect x="290" y="25" width="100" height="100" rx="8" fill="#494545" stroke="#dc2626" stroke-width="2"/>
  <text x="340" y="65" font-family="'Outfit', sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">Niveau 3</text>
  <text x="340" y="85" font-family="'Inter', sans-serif" font-size="10" fill="#d9d9d9" text-anchor="middle">Responsable Qualité</text>
  <text x="340" y="100" font-family="'Inter', sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">Trimestriel (Audit)</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>