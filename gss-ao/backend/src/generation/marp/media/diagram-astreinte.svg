<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 150" fill="none">
  <!-- Box 1 -->
  <rect x="10" y="25" width="120" height="90" rx="8" fill="#494545" stroke="#dc2626" stroke-width="2"/>
  <text x="70" y="60" font-family="'Outfit', sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">1. Alerte Absence</text>
  <text x="70" y="80" font-family="'Inter', sans-serif" font-size="10" fill="#d9d9d9" text-anchor="middle">Logiciel Comète</text>

  <!-- Arrow -->
  <path d="M140 70h40" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Box 2 -->
  <rect x="190" y="25" width="120" height="90" rx="8" fill="#494545" stroke="#dc2626" stroke-width="2"/>
  <text x="250" y="60" font-family="'Outfit', sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">2. Mobilisation</text>
  <text x="250" y="80" font-family="'Inter', sans-serif" font-size="10" fill="#d9d9d9" text-anchor="middle">Agent d'Astreinte</text>

  <!-- Arrow -->
  <path d="M320 70h40" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Box 3 -->
  <rect x="370" y="25" width="70" height="90" rx="8" fill="#dc2626"/>
  <text x="405" y="60" font-family="'Outfit', sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">&lt; 1h</text>
  <text x="405" y="80" font-family="'Inter', sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Arrivée</text>
  <text x="405" y="95" font-family="'Inter', sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">sur Site</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>