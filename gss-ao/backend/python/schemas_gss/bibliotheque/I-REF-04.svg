<text x="136.0" y="94.8" font-size="14" font-weight="400" fill="#463A2F" text-anchor="start">MAIRIE</text>
<text x="64.0" y="158.3" font-size="19.5" font-weight="700" fill="#463A2F" text-anchor="start">Ville de Port-Jérôme-sur-Seine</text>
<text x="64.0" y="189.5" font-size="15.5" font-weight="400" fill="#463A2F" text-anchor="start">Cinéma, théâtre, bâtiments communaux ·</text>
<text x="64.0" y="210.5" font-size="15.5" font-weight="400" fill="#463A2F" text-anchor="start">76330</text>
<rect x="40.0" y="270.0" width="360.0" height="116.0" rx="20.0" fill="#FBFAF4" filter="url(#od)"/>
<text x="64.0" y="339.9" font-size="34" font-weight="800" fill="#463A2F" text-anchor="start">2 à 30</text>
<text x="191.5" y="321.9" font-size="18" font-weight="400" fill="#463A2F" text-anchor="start">agents selon les</text>
<text x="191.5" y="346.4" font-size="18" font-weight="400" fill="#463A2F" text-anchor="start">besoins</text>
