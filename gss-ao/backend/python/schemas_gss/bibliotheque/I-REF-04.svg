<text x="470.0" y="84.0" font-size="20" font-weight="800" fill="#463A2F" text-anchor="start">NOS MISSIONS</text>
<rect x="470" y="98" width="56" height="5" rx="2.5" fill="#E99842"/>
<circle cx="479.0" cy="143.3" r="5" fill="#377E3F"/>
<text x="496.0" y="150.4" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">Filtrer les entrées du</text>
<text x="496.0" y="179.8" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">cinéma et de la salle de</text>
<text x="496.0" y="209.3" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">spectacle</text>
<circle cx="479.0" cy="245.4" r="5" fill="#377E3F"/>
<text x="496.0" y="252.4" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">Rondes de surveillance</text>
<text x="496.0" y="281.9" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">pendant les séances</text>
<circle cx="479.0" cy="318.0" r="5" fill="#377E3F"/>
<text x="496.0" y="325.0" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">Rondes de surveillance</text>
<text x="496.0" y="354.5" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">incendie pendant les</text>
<text x="496.0" y="384.0" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">spectacles</text>
<circle cx="479.0" cy="420.1" r="5" fill="#377E3F"/>
<text x="496.0" y="427.1" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">Filtrer et compter les</text>
<text x="496.0" y="456.6" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">entrées et sorties des</text>
<text x="496.0" y="486.1" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">événements</text>
<circle cx="479.0" cy="522.2" r="5" fill="#377E3F"/>
<text x="496.0" y="529.2" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">Organiser la surveillance</text>
<text x="496.0" y="558.7" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">de sûreté et sécurité des</text>
<text x="496.0" y="588.2" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">événements</text>
<circle cx="819.0" cy="143.3" r="5" fill="#377E3F"/>
<text x="836.0" y="150.4" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">Rondes de contrôle des</text>
<text x="836.0" y="179.8" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">installations incendie</text>
<circle cx="819.0" cy="215.9" r="5" fill="#377E3F"/>
<text x="836.0" y="223.0" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">Surveiller les installations</text>
<text x="836.0" y="252.4" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">à la fermeture au public</text>
<circle cx="819.0" cy="288.5" r="5" fill="#377E3F"/>
<text x="836.0" y="295.6" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">Interventions sur alarme</text>
<text x="836.0" y="325.0" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">des bâtiments</text>
<text x="836.0" y="354.5" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">municipaux</text>
<circle cx="819.0" cy="390.6" r="5" fill="#377E3F"/>
<text x="836.0" y="397.6" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">Rondes de vérification du</text>
<text x="836.0" y="427.1" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">matériel incendie et</text>
<text x="836.0" y="456.6" font-size="22" font-weight="400" fill="#463A2F" text-anchor="start">d'alerte</text>
