<text x="128.0" y="165.2" font-size="22" font-weight="700" fill="#463A2F" text-anchor="start">La palpation de sécurité</text>
<text x="128.0" y="200.4" font-size="17.5" font-weight="400" fill="#463A2F" text-anchor="start">S'assurer qu'une personne ne porte pas d'objet dangereux</text>
