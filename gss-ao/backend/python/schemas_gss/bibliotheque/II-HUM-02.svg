<text x="112.0" y="420.9" font-size="24" font-weight="400" fill="#463A2F" text-anchor="start">Elle est toujours effectuée par une personne du même sexe</text>
<rect x="68.0" y="455.15999999999997" width="26" height="26" rx="13.0" fill="#377E3F"/><path d="M73.5,468.15999999999997 L80.0,475.15999999999997 L89.0,461.15999999999997" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
