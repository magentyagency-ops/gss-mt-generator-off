<text x="91.8" y="308.6" font-size="23.5" font-weight="400" fill="#463A2F" text-anchor="start">Connaître les principes de base de la</text>
<text x="91.8" y="340.5" font-size="23.5" font-weight="400" fill="#463A2F" text-anchor="start">prévention</text>
