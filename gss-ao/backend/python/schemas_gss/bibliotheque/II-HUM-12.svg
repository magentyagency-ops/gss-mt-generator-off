<text x="91.8" y="380.7" font-size="23.5" font-weight="400" fill="#463A2F" text-anchor="start">Identifier les dangers et les personnes</text>
<text x="91.8" y="412.7" font-size="23.5" font-weight="400" fill="#463A2F" text-anchor="start">exposées</text>
<circle cx="74.2" cy="444.9" r="4.7" fill="#463A2F"/>
<text x="91.8" y="452.9" font-size="23.5" font-weight="400" fill="#463A2F" text-anchor="start">Informer sa hiérarchie</text>
