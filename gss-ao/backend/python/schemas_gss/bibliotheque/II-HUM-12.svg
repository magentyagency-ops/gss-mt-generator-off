<circle cx="74.2" cy="260.4" r="4.7" fill="#463A2F"/>
<text x="91.8" y="268.4" font-size="23.5" font-weight="400" fill="#463A2F" text-anchor="start">Intervenir lors d'un accident du travail</text>
