<text x="683.4" y="442.1" font-size="24" font-weight="400" fill="#463A2F" text-anchor="start">Perte de connaissance, arrêt</text>
<text x="683.4" y="474.7" font-size="24" font-weight="400" fill="#463A2F" text-anchor="start">cardiaque</text>
<circle cx="665.4" cy="507.6" r="4.8" fill="#463A2F"/>
<text x="683.4" y="515.8" font-size="24" font-weight="400" fill="#463A2F" text-anchor="start">Alerte aux populations</text>
