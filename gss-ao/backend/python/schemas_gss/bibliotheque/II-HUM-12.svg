<text x="91.8" y="493.0" font-size="23.5" font-weight="400" fill="#463A2F" text-anchor="start">Effectuer les gestes adaptés à l'état</text>
<text x="91.8" y="525.0" font-size="23.5" font-weight="400" fill="#463A2F" text-anchor="start">de la victime</text>
