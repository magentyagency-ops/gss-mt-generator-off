[project]
name = "gss-ao"
version = "0.1.0"
description = "Automatisation du traitement des appels d'offres GSS — backend (itération 1)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
markers = [
    "requires_libreoffice: test nécessitant le binaire soffice (conversion .doc)",
    "requires_corpus: test lisant le corpus local (Cas-Univ-Rouen / SLIDE REP AO)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
